[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lionz"
version = "1.1.0"
description = "A toolkit for precise segmentation of tumors in PET/CT scans."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Lalith Kumar Shiyam Sundar", email = "lalith.shiyamsundar@meduniwien.ac.at" },
    { name = "Sebastian Gutschmayer", email = "sebastian.gutschmayer@meduniwien.ac.at" },
    { name = "Manuel Pires", email = "manuel.pires@meduniwien.ac.at" }
]
keywords = [
    "lesion segmentation",
    "tumors",
    "PET/CT",
    "medical imaging"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "nnunetv2>=2.6.0",
    "nibabel",
    "halo",
    "pandas",
    "SimpleITK",
    "pydicom>=3.0.2",
    "imageio",
    "numpy",
    "matplotlib",
    "pyfiglet",
    "cfonts",
    "rich-click",
    "natsort",
    "pillow>=13.0.0",
    "colorama",
    "dask[distributed]>=2026.1.0",
    "rich",
    "dicom2nifti>=2.6.2",
    "emoji",
    "requests>=2.33.0",
    "opencv-python",
    # Security floors also protect installations resolved without uv.lock.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "msgpack>=1.2.3",
    "setuptools>=84.1.0",
    "tornado>=6.6",
    "urllib3>=2.8.0",
    "torch==2.13.0",
    "torchvision==0.28.0"
]
requires-python = ">=3.11,<3.14"
license-files = ["LICENSE"]

[project.scripts]
lionz = "lionz.lionz:main"

[project.urls]
Homepage = "https://github.com/ENHANCE-PET/LION"
"Bug Tracker" = "https://github.com/ENHANCE-PET/LION/issues"
Documentation = "https://lionz.readthedocs.io/en/latest/"
Source = "https://github.com/ENHANCE-PET/LION"

[dependency-groups]
dev = ["pytest==9.1.1", "mcp>=1.30.0,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lionz*"]

# Keep the patched inference runtime on CUDA 12.6 for locked Linux/Windows
# installations. Explicit indexing prevents other packages using this registry.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

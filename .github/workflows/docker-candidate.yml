name: Build Docker Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable Git tag to build, for example lionz-v.1.0.5"
        required: true
        type: string
      version:
        description: "LION version, for example 1.0.5"
        required: true
        type: string
      candidate_tag:
        description: "Docker candidate tag, for example 1.0.5-rc1"
        required: true
        type: string

concurrency:
  group: docker-candidate-${{ inputs.candidate_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.22"

      - name: Validate candidate metadata
        env:
          LIONZ_VERSION: ${{ inputs.version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv version --short)" = "$LIONZ_VERSION"
          [[ "$CANDIDATE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]

      - name: Run locked test suite
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIONZ_VERSION=${{ inputs.version }}
          tags: ${{ secrets.DOCKER_USERNAME }}/lionz:${{ inputs.candidate_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate digest
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Candidate digest: $CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: Build Docker Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "LION version, for example 1.0.5"
        required: true
        type: string

concurrency:
  group: docker-candidate-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v5
        with:
          ref: lionz-v.${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.9.22"

      - name: Validate release source and derive candidate metadata
        id: meta
        env:
          LIONZ_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LIONZ_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          expected_tag="lionz-v.${LIONZ_VERSION}"
          expected_commit="$(git rev-parse "refs/tags/${expected_tag}^{commit}")"
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$expected_commit"
          test "$(uv version --short)" = "$LIONZ_VERSION"

          candidate_tag="${LIONZ_VERSION}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "candidate_tag=$candidate_tag"
            echo "revision=$actual_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Run locked test suite
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            LIONZ_VERSION=${{ inputs.version }}
            LIONZ_REVISION=${{ steps.meta.outputs.revision }}
          tags: ${{ secrets.DOCKER_USERNAME }}/lionz:${{ steps.meta.outputs.candidate_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record candidate identity
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          CANDIDATE_TAG: ${{ steps.meta.outputs.candidate_tag }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          LIONZ_REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          {
            echo "Candidate: $DOCKER_USERNAME/lionz:$CANDIDATE_TAG"
            echo "Digest: $CANDIDATE_DIGEST"
            echo "Revision: $LIONZ_REVISION"
            echo "LMU-test this exact reference: $DOCKER_USERNAME/lionz@$CANDIDATE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
